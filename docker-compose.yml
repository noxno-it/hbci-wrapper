version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: hbci-postgres
    environment:
      POSTGRES_DB: hbci
      POSTGRES_USER: hbci
      POSTGRES_PASSWORD: hbci
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hbci-network

  hbci-service:
    build:
      context: ./hbci-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: hbci-service
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/hbci
      QUARKUS_DATASOURCE_USERNAME: hbci
      QUARKUS_DATASOURCE_PASSWORD: hbci
    depends_on:
      - postgres
    networks:
      - hbci-network

volumes:
  postgres-data:

networks:
  hbci-network:
    driver: bridge
